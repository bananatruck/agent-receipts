[package]
name = "agent-receipts"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Check report statements against local Git evidence"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.15"
