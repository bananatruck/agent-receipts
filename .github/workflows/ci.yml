name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  RUSTUP_TOOLCHAIN: stable

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Prepare build lock
        run: mkdir -p ~/overnight-2026-11-17/logs
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Check lints
        run: flock -w 1800 ~/overnight-2026-11-17/logs/heavy.lock cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: flock -w 1800 ~/overnight-2026-11-17/logs/heavy.lock cargo test --locked --all-targets
      - name: Build release
        run: flock -w 1800 ~/overnight-2026-11-17/logs/heavy.lock cargo build --locked --release
      - name: Run synthetic demo
        run: sh examples/demo.sh
